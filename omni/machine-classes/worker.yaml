metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: unraid-worker

spec:
  # Runtime image the node installs to disk after joining: firecracker + official
  # exts. Tag must match the cluster template Talos version.
  installImage: ghcr.io/syscode-labs/talos-images/installer:v1.13.7-libvirt
  autoprovision:
    providerid: libvirt
    providerdata: |
      cores: 4
      memory: 6144
      disk_size: 40
      storage_pool: "omni-domains"
      network_interfaces:
        - driver: "virtio"
          network_name: "default"
