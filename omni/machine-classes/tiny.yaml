metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: unraid-tiny

spec:
  # Runtime image the node installs to disk after joining: firecracker + official
  # exts. Tag must match the cluster template Talos version.
  installImage: ghcr.io/syscode-labs/talos-images/installer:v1.13.6
  autoprovision:
    providerid: libvirt
    providerdata: |
      cores: 1
      memory: 2048
      disk_size: 20
      storage_pool: "omni-domains"
      network_interfaces:
        - driver: "virtio"
          network_name: "default"
