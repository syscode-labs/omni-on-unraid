metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: unraid-cp

spec:
  autoprovision:
    providerid: libvirt
    providerdata: |
      cores: 4
      memory: 8192
      disk_size: 40
      storage_pool: "omni-domains"
      network_interfaces:
        - driver: "virtio"
          network_name: "default"
