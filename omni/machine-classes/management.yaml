metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: unraid-mgmt

spec:
  autoprovision:
    providerid: libvirt
    providerdata: |
      cores: 2
      memory: 4096
      disk_size: 40
      storage_pool: "omni-domains"
      network_interfaces:
        - driver: "virtio"
          network_name: "default"
