# Talos inline manifests for the homelab-management (mgmt) cluster.
# Cilium CNI + Argo CD + root App-of-Apps (GitOps).
#
# Regenerate after a Cilium or Argo CD version bump:
#   mise run omni:talos:generate-manifests

cluster:
  inlineManifests:
    - name: cilium
      contents: |
        # Generated by: mise run omni:talos:generate-manifests
        # Source: helm template cilium cilium/cilium --version <CILIUM_VERSION>
        #
        # Placeholder. Run the generator before syncing a production cluster.

    - name: argocd
      contents: |
        # Generated by: mise run omni:talos:generate-manifests
        # Source: https://raw.githubusercontent.com/argoproj/argo-cd/<ARGOCD_VERSION>/manifests/install.yaml
        #
        # Placeholder. Run the generator before syncing a production cluster.

    - name: argocd-app-of-apps
      contents: |
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: root
          namespace: argocd
        spec:
          project: default
          source:
            repoURL: https://github.com/syscode-labs/oci-talos-gitops-apps
            targetRevision: HEAD
            path: bootstrap
          destination:
            server: https://kubernetes.default.svc
            namespace: argocd
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
