# NodeLocal DNSCache for Talos 1.14 libvirt clusters.
# Pods use the node-local cache; it forwards cluster names to CoreDNS.
apiVersion: v1alpha1
kind: KubeletConfig
clusterDNS:
  - 169.254.20.10
---
apiVersion: v1alpha1
kind: KubeInlineManifestConfig
name: node-local-dns
manifest: |
  apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: node-local-dns
    namespace: kube-system
  ---
  apiVersion: v1
  kind: Service
  metadata:
    name: kube-dns-upstream
    namespace: kube-system
    labels:
      k8s-app: kube-dns
  spec:
    ports:
      - name: dns
        port: 53
        protocol: UDP
        targetPort: 53
      - name: dns-tcp
        port: 53
        protocol: TCP
        targetPort: 53
    selector:
      k8s-app: kube-dns
  ---
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: node-local-dns
    namespace: kube-system
  data:
    Corefile: |
      cluster.local:53 {
          errors
          cache {
              success 9984 30
              denial 9984 5
          }
          reload
          loop
          bind 169.254.20.10
          forward . 10.96.0.10 {
              force_tcp
          }
          prometheus :9253
          health 169.254.20.10:8080
      }
      in-addr.arpa:53 {
          errors
          cache 30
          reload
          loop
          bind 169.254.20.10
          forward . 10.96.0.10 {
              force_tcp
          }
          prometheus :9253
      }
      ip6.arpa:53 {
          errors
          cache 30
          reload
          loop
          bind 169.254.20.10
          forward . 10.96.0.10 {
              force_tcp
          }
          prometheus :9253
      }
      .:53 {
          errors
          cache 30
          reload
          loop
          bind 169.254.20.10
          forward . /etc/resolv.conf
          prometheus :9253
      }
  ---
  apiVersion: apps/v1
  kind: DaemonSet
  metadata:
    name: node-local-dns
    namespace: kube-system
    labels:
      k8s-app: node-local-dns
  spec:
    updateStrategy:
      rollingUpdate:
        maxUnavailable: 10%
    selector:
      matchLabels:
        k8s-app: node-local-dns
    template:
      metadata:
        labels:
          k8s-app: node-local-dns
        annotations:
          prometheus.io/port: "9253"
          prometheus.io/scrape: "true"
      spec:
        priorityClassName: system-node-critical
        serviceAccountName: node-local-dns
        hostNetwork: true
        dnsPolicy: Default
        tolerations:
          - effect: NoExecute
            operator: Exists
          - effect: NoSchedule
            operator: Exists
        containers:
          - name: node-cache
            image: registry.k8s.io/dns/k8s-dns-node-cache:1.26.8
            args:
              - -localip
              - 169.254.20.10
              - -conf
              - /etc/Corefile
              - -upstreamsvc
              - kube-dns-upstream
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
            resources:
              requests:
                cpu: 25m
                memory: 5Mi
            ports:
              - name: dns
                containerPort: 53
                protocol: UDP
              - name: dns-tcp
                containerPort: 53
                protocol: TCP
              - name: metrics
                containerPort: 9253
                protocol: TCP
            livenessProbe:
              httpGet:
                host: 169.254.20.10
                path: /health
                port: 8080
              initialDelaySeconds: 60
              timeoutSeconds: 5
            volumeMounts:
              - name: xtables-lock
                mountPath: /run/xtables.lock
              - name: config-volume
                mountPath: /etc/coredns
              - name: kube-dns-config
                mountPath: /etc/kube-dns
        volumes:
          - name: xtables-lock
            hostPath:
              path: /run/xtables.lock
              type: FileOrCreate
          - name: kube-dns-config
            configMap:
              name: kube-dns
              optional: true
          - name: config-volume
            configMap:
              name: node-local-dns
              items:
                - key: Corefile
                  path: Corefile.base
  ---
  apiVersion: v1
  kind: Service
  metadata:
    name: node-local-dns
    namespace: kube-system
    labels:
      k8s-app: node-local-dns
  spec:
    clusterIP: None
    ports:
      - name: metrics
        port: 9253
        targetPort: 9253
    selector:
      k8s-app: node-local-dns
