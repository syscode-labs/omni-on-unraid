kind: Cluster
name: unraid-lab
kubernetes:
  version: v1.36.3
talos:
  version: v1.13.7
features:
  diskEncryption: false
patches:
  - file: omni/patches/cni-none.yaml
  - file: omni/patches/disable-kube-proxy.yaml
  - file: omni/patches/inline-manifests.yaml
---
kind: ControlPlane
machineClass:
  name: unraid-cp
  size: 3
patches:
  - file: ../patches/allow-scheduling.yaml
