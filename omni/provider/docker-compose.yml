name: omni-libvirt-provider

services:
  omni-infra-provider-libvirt:
    # Tailscale fork: injects a tailscale ExtensionServiceConfig into node
    # first-boot user-data (via NODES_TAILSCALE_AUTHKEY) so nodes reach the
    # tailnet-only Omni SideroLink endpoint and join. See
    # github.com/syscode-labs/omni-infra-provider-libvirt-tailscale
    image: ghcr.io/syscode-labs/omni-infra-provider-libvirt:ca322bc
    container_name: omni-infra-provider-libvirt
    restart: unless-stopped
    volumes:
      - ../../generated/provider/libvirt-config.yaml:/config.yaml:ro
      - ${OMNI_PROVIDER_SSH_KEY_FILE:-/dev/null}:/.ssh/id_rsa:ro
    environment:
      USER: omni
      OMNI_ENDPOINT: "${OMNI_ENDPOINT}"
      OMNI_SERVICE_ACCOUNT_KEY: "${OMNI_SERVICE_ACCOUNT_KEY}"
      NODES_TAILSCALE_AUTHKEY: "${NODES_TAILSCALE_AUTHKEY}"
    command:
      - --omni-api-endpoint=${OMNI_ENDPOINT}
      - --omni-service-account-key=${OMNI_SERVICE_ACCOUNT_KEY}
      - --id=${OMNI_PROVIDER_ID:-libvirt}
      - --config-file=/config.yaml
