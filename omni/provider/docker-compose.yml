name: omni-libvirt-provider

services:
  omni-infra-provider-libvirt:
    # Plain upstream libvirt infra provider (no node tailscale injection).
    # Nodes reach the tailnet-only Omni via routing: libvirt host (bookofshadows)
    # advertises 192.168.122.0/24 into the tailnet and an ACL grant permits
    # 192.168.122.0/24 -> tag:omni:8090,50180. A libvirt-masquerade exemption on
    # the host keeps the VM source IP intact. See infra findings doc
    # 2026-07-16-libvirt-unraid-lab-tailnet-join.md.
    image: ghcr.io/syscode-labs/omni-infra-provider-libvirt:v0.2.0-onprem-factory
    container_name: omni-infra-provider-libvirt
    restart: unless-stopped
    volumes:
      - ../../generated/provider/libvirt-config.yaml:/config.yaml:ro
      - ${OMNI_PROVIDER_SSH_KEY_FILE:-/dev/null}:/.ssh/id_rsa:ro
    environment:
      USER: omni
      OMNI_ENDPOINT: "${OMNI_ENDPOINT}"
      OMNI_SERVICE_ACCOUNT_KEY: "${OMNI_SERVICE_ACCOUNT_KEY}"
      OMNI_IMAGE_FACTORY_ADDRESS: "${OMNI_IMAGE_FACTORY_ADDRESS}"
    command:
      - --omni-api-endpoint=${OMNI_ENDPOINT}
      - --omni-service-account-key=${OMNI_SERVICE_ACCOUNT_KEY}
      - --id=${OMNI_PROVIDER_ID:-libvirt}
      - --config-file=/config.yaml
