[tools]
terraform = "1.9.8"
go = "1.25.8"
omnictl = "1.9.3"
kubectl = "1.34.2"
kustomize = "5.7.1"
yq = "4.53.3"

[tasks."infra:prepare-image"]
description = "Download/sync Ubuntu cloud image to libvirt host path"
run = "./scripts/prepare-base-image.sh"

[tasks."infra:check"]
description = "Validate required .env inputs for infra provisioning"
run = "./scripts/infra-check.sh"

[tasks."infra:init"]
description = "Initialize Terraform for Omni VM infrastructure"
run = "./scripts/run-terraform.sh init"

[tasks."infra:plan"]
description = "Plan Omni VM infrastructure changes"
depends = ["infra:check"]
run = "./scripts/run-terraform.sh plan"

[tasks."infra:apply"]
description = "Apply Omni VM infrastructure"
depends = ["infra:check"]
run = "./scripts/run-terraform.sh apply"

[tasks."infra:destroy"]
description = "Destroy Omni VM infrastructure"
run = "./scripts/run-terraform.sh destroy"

[tasks."omni:version-check"]
description = "Fail if omnictl on PATH doesn't match the deployed Omni server version"
run = "./scripts/check-omni-version.sh"

[tasks."omni:doctor"]
description = "Validate local prerequisites for Omni operations"
run = '''
set -euo pipefail
command -v docker >/dev/null
if ! docker compose version >/dev/null 2>&1; then
  echo "docker compose plugin is required" >&2
  exit 1
fi
if [ ! -f .env ]; then
  echo "Missing .env (copy templates/omni.env.example .env)" >&2
  exit 1
fi
echo "Prerequisites look good"
'''

[tasks."omni:health:compose-env"]
description = "Verify generated Omni compose env uses persistent state and expected cert wiring"
run = "go run ./cmd/omni-health compose-env --path generated/compose.env"

[tasks."omni:health:tls"]
description = "Verify Omni web TLS and no-SNI machine API TLS"
run = '''
set -euo pipefail
if [ -f .env ]; then
  set -a
  . ./.env
  set +a
fi
domain="${OMNI_TS_DOMAIN:-${OMNI_DOMAIN:-}}"
if [ -z "$domain" ]; then
  echo "Set OMNI_DOMAIN or OMNI_TS_DOMAIN in .env" >&2
  exit 1
fi
machine_args=()
if [ -n "${OMNI_MACHINE_API_SMOKE_ADDR:-}" ]; then
  machine_args=(--machine-api-addr "$OMNI_MACHINE_API_SMOKE_ADDR")
elif [ -n "${OMNI_SIDEROLINK_API_URL:-}" ]; then
  machine_args=(--machine-api-url "$OMNI_SIDEROLINK_API_URL")
fi
go run ./cmd/omni-health tls --domain "$domain" "${machine_args[@]}"
'''

[tasks."omni:health"]
description = "Run local Omni deployment health checks"
depends = ["omni:health:compose-env", "omni:health:tls"]

[tasks."omni:render"]
description = "Render pinned Omni deployment assets"
run = "./scripts/render.sh"

[tasks."omni:issue-cert"]
description = "Issue/renew public TLS cert locally via ACME DNS-01"
run = "./scripts/issue-cert.sh"

[tasks."omni:up"]
description = "Start Omni stack"
run = "./scripts/up.sh"

[tasks."omni:down"]
description = "Stop Omni stack"
run = "./scripts/down.sh"

[tasks."omni:backup"]
description = "Backup Omni data"
run = "./scripts/backup.sh"

[tasks."omni:restore"]
description = "Restore Omni data from BACKUP"
run = '''
set -euo pipefail
if [ -z "${BACKUP:-}" ]; then
  echo "Set BACKUP=/path/to/backup.tar.gz" >&2
  exit 1
fi
./scripts/restore.sh "$BACKUP"
'''

[tasks."omni:deploy-remote"]
description = "Sync repo to Omni VM and apply Omni there"
run = "./scripts/deploy-remote.sh"

[tasks."omni:tools:shell"]
description = "Open mise-managed shell with omnictl, kubectl, kustomize, and Go"
run = "mise shell"

[tasks."release:check"]
description = "Validate GoReleaser release configuration"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "Build local GoReleaser snapshot artifacts"
run = "goreleaser release --snapshot --clean"

[tasks."omni:provider:apply"]
description = "Start Omni libvirt infrastructure provider via Docker Compose"
run = '''
omnictl apply -f omni/provider/infra-provider.yaml
go run ./cmd/omni-render provider-config --output generated/provider/libvirt-config.yaml
docker compose -f omni/provider/docker-compose.yml --env-file .env up -d
'''

[tasks."omni:provider:status"]
description = "Show Omni libvirt infrastructure provider status"
run = "docker compose -f omni/provider/docker-compose.yml --env-file .env ps"

[tasks."omni:provider:logs"]
description = "Tail Omni libvirt infrastructure provider logs"
run = "docker compose -f omni/provider/docker-compose.yml --env-file .env logs -f"

[tasks."omni:provider:down"]
description = "Stop Omni libvirt infrastructure provider"
run = "docker compose -f omni/provider/docker-compose.yml --env-file .env down"

[tasks."omni:image-factory:render-config"]
description = "Render on-prem Image Factory config used for custom Talos schematics"
run = "go run ./cmd/omni-render image-factory-config --output generated/image-factory/config.yaml"

[tasks."omni:image-factory:up"]
description = "Start on-prem Image Factory via Docker Compose"
depends = ["omni:image-factory:render-config"]
run = "docker compose -f omni/image-factory/docker-compose.yml --env-file .env up -d"

[tasks."omni:image-factory:status"]
description = "Show on-prem Image Factory status"
run = "docker compose -f omni/image-factory/docker-compose.yml --env-file .env ps"

[tasks."omni:image-factory:logs"]
description = "Tail on-prem Image Factory logs"
run = "docker compose -f omni/image-factory/docker-compose.yml --env-file .env logs -f"

[tasks."omni:image-factory:down"]
description = "Stop on-prem Image Factory"
run = "docker compose -f omni/image-factory/docker-compose.yml --env-file .env down"

[tasks."omni:machineclass:render"]
description = "Render Omni dynamic libvirt MachineClasses"
run = '''
set -euo pipefail
go run ./cmd/omni-render machineclass --output generated/machineclass-control-plane.yaml --machine-class unraid-cp
go run ./cmd/omni-render machineclass --output generated/machineclass-worker.yaml --machine-class unraid-worker
'''

[tasks."omni:machineclass:apply"]
description = "Apply UI-selectable Omni libvirt MachineClasses with omnictl"
depends = ["omni:version-check", "omni:machineclass:render"]
run = '''
omnictl apply -f generated/machineclass-control-plane.yaml
omnictl apply -f generated/machineclass-worker.yaml
'''

[tasks."omni:cluster:render"]
description = "Render Omni cluster template using dynamic machine allocation"
run = "go run ./cmd/omni-render cluster --output generated/cluster.yaml --machine-class unraid-cp"

[tasks."omni:cluster:apply"]
description = "Validate, sync, and wait on Omni cluster template"
depends = ["omni:version-check", "omni:cluster:render"]
run = '''
omnictl cluster template validate -f generated/cluster.yaml
omnictl cluster template sync -f generated/cluster.yaml --verbose
omnictl cluster template status -f generated/cluster.yaml
'''

[tasks."omni:cluster:status"]
description = "Show Omni cluster template status"
depends = ["omni:cluster:render"]
run = "omnictl cluster template status -f generated/cluster.yaml"

[tasks."omni:machines"]
description = "List machines known to Omni (id, address, connected)"
run = "omnictl get machines"

[tasks."omni:machines:watch"]
description = "Watch Omni machines live (Ctrl-C to stop)"
run = "omnictl get machines -w"

[tasks."omni:talos:generate-manifests"]
description = "Generate Cilium and Argo CD inline manifests for the Talos cluster template"
run = "./omni/scripts/generate-manifests.sh"

[tasks."auth:pocketid:render-oidc-sql"]
description = "Render Pocket-ID OIDC client SQL required by Omni"
run = "go run ./cmd/omni-render pocketid-oidc-sql --output generated/pocket-id-omni-oidc-client.sql"

[tasks."omni:lab:provision"]
description = "Provision 3-node Talos lab cluster through Omni and its libvirt provider"
depends = ["omni:provider:apply", "omni:provider:status", "omni:machineclass:apply", "omni:cluster:apply"]

[tasks."stack:provision"]
description = "Bootstrap Omni control-plane VM on Unraid; not Talos cluster provisioning"
depends = ["infra:prepare-image", "infra:apply", "omni:deploy-remote"]

[tasks."ctr:shell"]
description = "Open interactive shell in ops container"
run = "./scripts/in-container.sh"

[tasks."ctr:infra:prepare-image"]
description = "Containerized infra:prepare-image"
run = "./scripts/prepare-base-image.sh"

[tasks."ctr:infra:check"]
description = "Containerized infra:check"
run = "./scripts/infra-check.sh"

[tasks."ctr:infra:init"]
description = "Containerized infra:init"
run = "./scripts/in-container.sh ./scripts/run-terraform.sh init"

[tasks."ctr:infra:plan"]
description = "Containerized infra:plan"
run = "./scripts/in-container.sh ./scripts/run-terraform.sh plan"

[tasks."ctr:infra:apply"]
description = "Containerized infra:apply"
depends = ["ctr:infra:check"]
run = "./scripts/in-container.sh ./scripts/run-terraform.sh apply"

[tasks."ctr:infra:destroy"]
description = "Containerized infra:destroy"
run = "./scripts/in-container.sh ./scripts/run-terraform.sh destroy"

[tasks."ctr:omni:deploy-remote"]
description = "Containerized omni:deploy-remote"
run = "./scripts/deploy-remote.sh"

[tasks."ctr:stack:provision"]
description = "Containerized stack provision (image -> apply -> deploy)"
depends = ["ctr:infra:prepare-image", "ctr:infra:apply", "ctr:omni:deploy-remote"]
