name: Talos release receiver

on:
  repository_dispatch:
    types: [talos-release-request]

permissions:
  actions: write
  contents: read

concurrency:
  group: talos-release-unraid-${{ github.event.client_payload.release_id }}
  cancel-in-progress: false

jobs:
  rollout:
    outputs:
      duplicate_delivery: ${{ steps.release-claim.outputs.cache-hit }}
      claim_saved: ${{ steps.claim-saved.outputs.claim_saved }}
    # sender_repo is a controller contract field, not sender authentication.
    # Validate the complete immutable request before any side effect.
    if: github.event.client_payload.sender_repo == 'syscode-labs/talos-release-controller'
    runs-on:
      group: omni-runner
      labels: self-hosted
    steps:
      - uses: actions/checkout@v4
      # Install only mise itself; the receipt below installs Go alone, not all tools.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
      # Bootstrap only the repository-pinned Go toolchain needed to validate
      # untrusted dispatch input; payload-derived clients are installed later.
      - name: Install validator Go runtime
        run: |
          set -euo pipefail
          command -v mise
          mise --version
          mise install go
          mise exec -- go version
      - name: Validate controller request and immutable artifact
        id: validate
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          validated="$(mktemp)"
          trap 'rm -f "$validated"' EXIT
          printf '%s' "$PAYLOAD" | mise exec -- go run ./cmd/release-dispatch-validate > "$validated"
          cat "$validated" >> "$GITHUB_ENV"
          release_id="$(grep '^RELEASE_ID=' "$validated" | cut -d= -f2-)"
          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
      - name: Install and verify the complete release runtime
        run: |
          set -euo pipefail
          command -v mise
          mise --version
          # Keep the release runtime explicit: `mise install` alone would
          # install unrelated configuration, including OpenTofu.
          mise install omnictl yq "kubectl@${RELEASE_KUBERNETES_VERSION}" "talosctl@${RELEASE_TALOS_VERSION}"
          mise exec -- go version
          mise exec -- omnictl --version
          mise exec -- yq --version
          mise exec -- kubectl version --client
          mise exec -- talosctl version --client
          test -x "$HOME/.local/bin/mise"
      - name: Check durable release claim
        id: release-claim
        uses: actions/cache/restore@v4
        with:
          path: .release-dispatch/${{ steps.validate.outputs.release_id }}.json
          key: unraid-release-${{ steps.validate.outputs.release_id }}
          lookup-only: true
      - name: Reject a previously claimed release
        if: steps.release-claim.outputs.cache-hit == 'true'
        run: |
          echo "release $RELEASE_ID was already claimed; refusing to repeat destructive work" >&2
          exit 1
      - name: Run non-mutating release preflight
        if: steps.release-claim.outputs.cache-hit != 'true'
        env:
          OMNI_ENDPOINT: ${{ secrets.OMNI_ENDPOINT }}
          OMNI_SERVICE_ACCOUNT_KEY: ${{ secrets.OMNI_SERVICE_ACCOUNT_KEY }}
          OMNI_PROVIDER_COMPOSE_FILE: /opt/omni/omni/provider/docker-compose.yml
          OMNI_PROVIDER_PROJECT_NAME: omni-libvirt-provider
          OMNI_PROVIDER_CONTAINER: omni-infra-provider-libvirt
        run: |
          set -euo pipefail
          test -n "$OMNI_ENDPOINT"
          test -n "$OMNI_SERVICE_ACCOUNT_KEY"
          CLUSTER_NAME=unraid-lab \
          VERSIONS_YAML_URL="https://raw.githubusercontent.com/${RELEASE_SOURCE_REPO}/${RELEASE_SOURCE_SHA}/omni/versions.yaml" \
          OMNI_INSTALL_IMAGE="$RELEASE_INSTALL_IMAGE" \
          mise exec -- mise run omni:release:preflight
      - name: Persist release claim before mutation
        if: steps.release-claim.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .release-dispatch
          printf '{"release_id":"%s","build_run_id":%s}\n' "$RELEASE_ID" "$RELEASE_BUILD_RUN_ID" > ".release-dispatch/${RELEASE_ID}.json"
      - name: Save durable release claim
        id: save-release-claim
        if: steps.release-claim.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .release-dispatch/${{ steps.validate.outputs.release_id }}.json
          key: unraid-release-${{ steps.validate.outputs.release_id }}
      - name: Mark durable release claim saved
        id: claim-saved
        if: steps.release-claim.outputs.cache-hit != 'true' && steps.save-release-claim.outcome == 'success'
        run: echo 'claim_saved=true' >> "$GITHUB_OUTPUT"
      - name: Run guarded rollout
        if: steps.release-claim.outputs.cache-hit != 'true'
        env:
          OMNI_ENDPOINT: ${{ secrets.OMNI_ENDPOINT }}
          OMNI_SERVICE_ACCOUNT_KEY: ${{ secrets.OMNI_SERVICE_ACCOUNT_KEY }}
          OMNI_PROVIDER_COMPOSE_FILE: /opt/omni/omni/provider/docker-compose.yml
          OMNI_PROVIDER_PROJECT_NAME: omni-libvirt-provider
          OMNI_PROVIDER_CONTAINER: omni-infra-provider-libvirt
        run: |
          set -euo pipefail
          test -n "$OMNI_ENDPOINT"
          test -n "$OMNI_SERVICE_ACCOUNT_KEY"
          CLUSTER_NAME=unraid-lab \
          VERSIONS_YAML_URL="https://raw.githubusercontent.com/${RELEASE_SOURCE_REPO}/${RELEASE_SOURCE_SHA}/omni/versions.yaml" \
          OMNI_INSTALL_IMAGE="$RELEASE_INSTALL_IMAGE" \
          mise exec -- mise run omni:release:apply
      - name: Verify Talos, Omni, and Kubernetes convergence
        if: steps.release-claim.outputs.cache-hit != 'true'
        env:
          OMNI_ENDPOINT: ${{ secrets.OMNI_ENDPOINT }}
          OMNI_SERVICE_ACCOUNT_KEY: ${{ secrets.OMNI_SERVICE_ACCOUNT_KEY }}
        run: |
          set -euo pipefail
          test -n "$OMNI_ENDPOINT"
          test -n "$OMNI_SERVICE_ACCOUNT_KEY"
          CLUSTER_NAME=unraid-lab \
          TALOS_VERSION="$RELEASE_TALOS_VERSION" \
          KUBERNETES_VERSION="$RELEASE_KUBERNETES_VERSION" \
          mise exec -- mise run omni:release:health

  report:
    # A duplicate is a reconciliation result, not permission to silently leave
    # the controller pending. The controller blocks it unless original-attempt
    # evidence can prove a terminal outcome.
    if: always() && github.event.client_payload.sender_repo == 'syscode-labs/talos-release-controller'
    needs: rollout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_CONTROLLER_APP_ID }}
          private-key: ${{ secrets.RELEASE_CONTROLLER_APP_PRIVATE_KEY }}
          owner: syscode-labs
          repositories: talos-release-controller
      - name: Report correlated result
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          OUTCOME: ${{ needs.rollout.result == 'success' && 'success' || 'failure' }}
          ATTEMPT_STATE: ${{ needs.rollout.outputs.duplicate_delivery == 'true' && 'existing_claim' || (needs.rollout.result == 'failure' && needs.rollout.outputs.claim_saved != 'true' && 'failed_pre_mutation' || '') }}
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD" | go run ./cmd/release-dispatch-result > dispatch.json
          gh api repos/syscode-labs/talos-release-controller/dispatches --method POST --input dispatch.json
